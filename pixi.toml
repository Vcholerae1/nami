# Local Linux+CUDA environment (exact torch pin for this machine).
# Package metadata / pip install: pyproject.toml + setup.py

[workspace]
name = "nami"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
# Match pyproject runtime deps; pin a CUDA torch wheel for this env.
torch = { version = "==2.11.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
numpy = ">=1.24"

# Dev-only tooling, opt-in via `pixi run -e dev pytest` / `pixi shell -e dev`.
[feature.dev.dependencies]
pytest = ">=9.1.1"
ruff = ">=0.16.2"

[environments]
default = []
dev = ["dev"]
